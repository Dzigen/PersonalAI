services:

  aerospike_golden_gigachat:
    container_name: personalai_aerospike
    hostname: aerospikelservice
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ../aerospike_volumes/golden_gigachat/data:/opt/aerospike/data
      - ../aerospike_volumes/configs:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  aerospike_built_gigachat:
    container_name: personalai_aerospike
    hostname: aerospikelservice
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ../aerospike_volumes/built_gigachat/data:/opt/aerospike/data
      - ../aerospike_volumes/configs:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  # Database - Neo4j
  neo4j:
    container_name: personalai_mmenschikov_neo4j
    image: neo4j:5.21.0-enterprise
    hostname: personalai_mmenschikov_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ../neo4j_volume/data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  mongo:
    container_name: personalai_mmenschikov_mongo
    image: mongo:7.0.9
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    ports:
      - 27017:27017
    volumes:
      - ../mongo_volume/data:/data/db
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  redis:
    container_name: personalai_mmenschikov_redis
    image: redis:latest
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=my_redis_password
      - REDIS_USER=my_user
      - REDIS_USER_PASSWORD=my_user_password
    ports:
      - 6380:6379
    volumes:
      - ../redis_volume/redis.conf:/usr/local/etc/redis/redis.conf
      - ../redis_volume/data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  workspace:
    image: m.menschikov/workspace:v1
    container_name: personalai_mmenschikov_worksapce
    hostname: worksapceservice
    ports:
      - "10888:10888"
    volumes:
      - ./:/workspace
    depends_on:
      - aerospike_built_gigachat
      - neo4j
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
