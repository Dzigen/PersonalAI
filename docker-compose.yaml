services:

  aerospike_golden_gigachat:
    user: "4200235:4200235"
    container_name: personalai_aerospike
    hostname: aerospikelservice
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ../aerospike_volumes/golden_gigachat/data:/opt/aerospike/data
      - ../aerospike_volumes/configs:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  aerospike_built_gigachat:
    user: "4200235:4200235"
    container_name: personalai_aerospike
    hostname: aerospikelservice
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ../aerospike_volumes/built_gigachat/data:/opt/aerospike/data
      - ../aerospike_volumes/configs:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  # Database - Neo4j
  neo4j:
    container_name: personalai_mmenschikov_neo4j
    user: "4200235:4200235"
    image: neo4j:5.21.0-enterprise
    hostname: personalai_mmenschikov_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ../neo4j_volume/data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  workspace:
    image: m.menschikov/workspace:v1
    container_name: personalai_mmenschikov_worksapce
    hostname: worksapceservice
    ports:
      - "10888:10888"
    volumes:
      - ../:/home/m.menschikov/workspace
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  empty_workspace:
    image: m.menschikov/empty_workspace:v1
    container_name: personalai_mmenschikov_empty_worksapce
    hostname: emptyworksapceservice
    ports:
      - "10888:10888"
    volumes:
      - ../:/home/workspace
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]


  ollama_agent:
    #image: m.menschikov/agent_service:v1
    image: ollama/ollama:latest
    container_name: personalai_mmenschikov_ollama_service
    hostname: ollamaservice
    ports:
      - "11434:11434"
    volumes:
      - ../ollama_volume:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  mongo_cache:
    image: mongo:latest
    container_name: personalai_mmenschikov_mongo_cache
    hostname: mongo_cache
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    ports:
      - "27017:27017"
    volumes:
      - ./data/knowledge_graphs/diaasqa/gigachat_full/kv_cache/persistent_volume/:/data/db/
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 40G
        reservations:
          cpus: '1'
          memory: 5G

  redis_cache:
    image: redis:latest
    container_name: personalai_mmenschikov_redis_cache
    hostname: redis_cache
    ports:
      - "6380:6379"
    volumes:
      - ./data/knowledge_graphs/diaasqa/gigachat_full/kv_cache/ram_volume:/data
      - ./configs/redis:/usr/local/etc/redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 6G
