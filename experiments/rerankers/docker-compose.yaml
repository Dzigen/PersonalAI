  workspace:
    image: m.menschikov/workspace:v2
    container_name: ${WORKSPACE_CNTNAME}
    hostname: ${WORKSPACE_HOST}
    network_mode: "host"
    volumes:
      - ${EXTERNAL_VCOMPOSERS_PATH}:${INTERNAL_VCOMPOSERS_PATH}
      - ${EXTERNAL_SPEC_QADS_PATH}:${INTERNAL_SPEC_QADS_PATH}
      - ${EXTERNAL_EXP_PATH}:${INTERNAL_EXP_PATH}
      - ${EXTERNAL_SRC_PATH}:${INTERNAL_SRC_PATH}
      - ${EXTERNAL_MODELS_PATH}:${INTERNAL_MODELS_PATH}
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['${WORKSPACE_DEVICE_ID}']
              capabilities: [gpu]
