vcomposer_name: 'hotpotqa241025' # TO CHANGE
dataset_name: 'hotpotqa_distractor_validation'
batch_size: 16
need_clear: False # !!! ATTENTION !!!

vdb_configs: # TO CHANGE
  dense_e5large:
    vendor: chroma
    db_category: 'dense'
    db_info:
      db: 'rerankerexps'
      table: 'e5large'
    params:
      hnsw:space: ip
      hnsw:M: 4096
    conn:
      path: "{{ vcomposer_save_dir }}/{{ vcomposer_name }}/chroma_e5large"

  dense_frida:
    vendor: chroma
    db_category: 'dense'
    db_info:
      db: 'rerankerexps'
      table: 'frida'
    params:
      hnsw:space: ip
      hnsw:M: 4096
    conn:
      path: "{{ vcomposer_save_dir }}/{{ vcomposer_name }}/chroma_frida"

  sparse_bm25:
    vendor: inmemory
    db_category: 'sparse_bm25'
    db_info:
      db: 'rerankerexps'
      table: 'bm25'
    params:
        load_from_disk: False
        load_dump_name: None
        load_dump_dir: "{{ vcomposer_save_dir }}/{{ vcomposer_name }}/inmemory_bm25"
        save_on_disk: True
        save_dump_dir: "{{ vcomposer_save_dir }}/{{ vcomposer_name }}/inmemory_bm25"

embedder_configs: # TO CHANGE
  e5large:
    prompts:
      query: "query: "
      passage: "passage: "
    query_prompt_name: 'query'
    passage_prompt_name: 'passage'
    model_name_or_path: 'intfloat/multilingual-e5-large'

  frida:
    query_prompt_name: 'search_query'
    passage_prompt_name: 'search_document'
    model_name_or_path: 'ai-forever/FRIDA'

vdb_to_embedder_mapping: # TO CHANGE
  dense_e5large: e5large
  dense_frida: frida

WORKSPACE_CONTAINER_DIRS:
  base_path: '/home/workspace'
  vcomposers_data: 'data/reranker_exps'
  qa_datasets: 'data/qa_datasets/v3'
  src: 'src'
  models: 'models'

SAVE_CONFIGS_NAMES:
  elapsed_time: elapsed_time.json
  vdb_configs: vdb_configs
  embedder_configs: embedder_configs
  params: params.yaml
