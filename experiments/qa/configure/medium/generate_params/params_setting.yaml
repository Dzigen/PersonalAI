# STAGE # 1
query_preprocessor: # TO CHANGE
  denoising_config: # CAN BE null
    - null
    # - agent_tasks_config:
    #    swremoval: 'v2'
    #    grammarcheck: 'v2'

  enhancing_config: # CAN BE null
    - null
    # - agent_tasks_config:
    #     qexpan: 'v2'
    #     termscheck: 'v2'
    #     lingcheck: 'v1'

  decomposition_config: # CAN BE null
    - null
    # - agent_tasks_config:
    #     classify: 'v2'
    #     decompose: 'v2'

# STAGE # 2
kg_reasoner: # TO CHANGE
  reasoner_name: "medium" # DONT CHANGE
  reasoner_config:
    max_searchplan_steps:
      - 6
    answer_something:
      - True

    searchplan_enhancer_config:
      - agent_tasks_config:
          plan_initing: 'v2'
          enhance_classifier: 'v2'
          plan_enhancing: 'v2'

    entities_extractor_config:
      - agent_tasks_config:
          entities_extraction: 'v1'

    e2n_matcher_config:
      - max_n: 2
        reranker_driver_config:
          name: 'ensemble_fusion' # DONT CHANGE
          strategy_config:
            vdb_names: ['dense_nodes', 'bm25_nodes']
            retriever_configs:
              - fetch_n: 20
                threshold: 0.5
              - fetch_n: 20
                threshold: 0.5
            weights: [0.4, 0.6]
            c: 60

    cluequeries_generator_config:
      max_cqueries_amount: 
        - 3
      agent_tasks_config:
        cquerie_generator: 
          - 'v4'

    knowledge_retriever_config:
      # NEED TO SPECIFY RETRIEVER HYPERP-KEY/VALUES BY YOUR OWN
      retriever_method:
        - 'naive_retriever'
        - 'mixture'

      retriever_config:
        - max_k: 50
          reranker_driver_config:
            name: single_step
            strategy_config:
              vdb_name: dense_triplets
              threshold: 0.5
              fetch_n: 50

        - retriever1_name: beamsearch
          retriever1_config:
            reranker_driver_config:
              name: single_step
              strategy_config:
                vdb_name: dense_triplets
                threshold: 0.5
                fetch_n: 25
            max_depth: 5
            max_paths: 10
            same_path_intersection_by_node: false
            diff_paths_intersection_by_node: false
            diff_paths_intersection_by_rel: false
            mean_alpha: 0.75
            final_sorting_mode: mixed
          retriever2_name: watercircles
          retriever2_config:
            strict_filter: true
            hyper_num: 15
            episodic_num: 15
            chain_triplets_num: 25
            other_triplets_num: 6
            do_text_pruning: false
          accepted_node_types:
          - hyper
          - episodic

      filter_method: # CAN BE null
        - 'naive'
        
      filter_config: # CAN BE null
        - max_k: 50
          reranker_driver_config:
            name: 'ensemble_fusion' # DONT CHANGE
            strategy_config:
              vdb_names: ['dense_triplets', 'bm25_triplets']
              retriever_configs:
                - fetch_n: 50
                  threshold: 0.5
                - fetch_n: 50
                  threshold: 0.5
              weights: [0.9, 0.1]
              c: 60
          accepted_triplets_types:
            - 'simple'
            - 'hyper'

    clueanswer_generator_config:
      agent_tasks_config:
        cagen:
          - 'v3'

    clueanswers_summarizer_config:
      agent_tasks_config:
        canswers_summarisation:
          - 'v3'

    answer_generator_config:
      agent_tasks_config:
        answer_classifier:
          - 'v2'
        answer_generator:
          - 'v3'

# STAGE # 3
answer_aggregator:
  agent_tasks_config:
    suba_summarisation:
      - 'v2'
