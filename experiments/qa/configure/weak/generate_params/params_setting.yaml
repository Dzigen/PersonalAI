DATASET_NAME: # TO CHANGE
  - 'hotpotqa_distractor_validation'
  - 'rubq_dev'
KNOWLEDGE_GRAPH_NAME: # TO CHANGE
  - ['deepseek_231025_v2prompts', 'gigachatmax_051125_v2prompts', 'llama318b_221025_v2prompts', 'qwen38b_261025_v2prompts'] 
  - ['gigachatmax_281025_v2prompts']

QA_DATASET_HYPERP:
  # NEED TO SPECIFY DATASET HYPERP-KEY/VALUES BY YOUR OWN
  max_samples_per_pack: 100
  lang:
    - 'en'
    - 'ru'

# STAGE # 1
query_preprocessor: # TO CHANGE
  denoising_config: # CAN BE null
    - null
    # - agent_tasks_config:
    #    swremoval: 'v2'
    #    grammarcheck: 'v2'

  enhancing_config: # CAN BE null
    - null
    # - agent_tasks_config:
    #     qexpan: 'v2'
    #     termscheck: 'v2'
    #     lingcheck: 'v1'

  decomposition_config: # CAN BE null
    - null
    - agent_tasks_config:
        classify: 'v1'
        decompose: 'v1'

# STAGE # 2
kg_reasoner: # TO CHANGE
  reasoner_name: "weak" # DONT CHANGE
  reasoner_config:
    query_parser_config: # CAN BE null
      - agent_tasks_config:
          kw_extraction: 'v2'

    knowledge_comparator_config: # CAN BE null
      - max_k: 2
        k_compare: 5
        reranker_driver_config:
          name: 'ensemble_fusion' # DONT CHANGE
          strategy_config:
            vdb_names: ['dense_nodes', 'bm25_nodes']
            retriever_configs:
              - fetch_n: 20
                threshold: 0.5
              - fetch_n: 20
                threshold: 0.5
            weights: [0.2, 0.8]
            c: 60

    knowledge_retriever_config:
      # NEED TO SPECIFY RETRIEVER HYPERP-KEY/VALUES BY YOUR OWN
      retriever_method:
        - 'beamsearch'
        - 'beamsearch'
        - 'beamsearch'

      retriever_config:
        - reranker_driver_config:
            name: 'single_step'
            strategy_config:
              vdb_name: dense_triplets
              threshold: 0.5
              fetch_n: 50
          max_depth: 5
          max_paths: 10
          same_path_intersection_by_node: False
          diff_paths_intersection_by_node: False
          diff_paths_intersection_by_rel: False
          mean_alpha: 0.75
          final_sorting_mode: 'mixed'

          accepted_node_types:
            - 'hyper'
            - 'episodic'

        - reranker_driver_config:
            name: 'single_step'
            strategy_config:
              vdb_name: dense_triplets
              threshold: 0.5
              fetch_n: 50
          max_depth: 5
          max_paths: 10
          same_path_intersection_by_node: False
          diff_paths_intersection_by_node: False
          diff_paths_intersection_by_rel: False
          mean_alpha: 0.75
          final_sorting_mode: 'mixed'

          accepted_node_types:
            - 'object'
            - 'episodic'

        - reranker_driver_config:
            name: 'single_step'
            strategy_config:
              vdb_name: dense_triplets
              threshold: 0.5
              fetch_n: 50
          max_depth: 5
          max_paths: 10
          same_path_intersection_by_node: False
          diff_paths_intersection_by_node: False
          diff_paths_intersection_by_rel: False
          mean_alpha: 0.75
          final_sorting_mode: 'mixed'

          accepted_node_types:
            - 'object'
            - 'hyper'
            - 'episodic'

      filter_method: # CAN BE null
        - 'naive'

      filter_config: # CAN BE null        
        - max_k: 50
          reranker_driver_config:
            name: 'ensemble_fusion' # DONT CHANGE
            strategy_config:
              vdb_names: ['dense_triplets', 'bm25_triplets']
              retriever_configs:
                - fetch_n: 50
                  threshold: 0.5
                - fetch_n: 50
                  threshold: 0.5
              weights: [0.7, 0.3]
              c: 60
          accepted_triplets_types:
            - 'simple'
            - 'hyper'
            - 'episodic'
        - max_k: 50
          reranker_driver_config:
            name: 'ensemble_fusion' # DONT CHANGE
            strategy_config:
              vdb_names: ['dense_triplets', 'bm25_triplets']
              retriever_configs:
                - fetch_n: 50
                  threshold: 0.5
                - fetch_n: 50
                  threshold: 0.5
              weights: [0.8, 0.2]
              c: 60
          accepted_triplets_types:
            - 'simple'
            - 'hyper'
            - 'episodic'

    answer_generator_config: # TO CHANGE
      - agent_tasks_config:
          ag: 'v2'
        relation_type:
          - 'simple'
          - 'hyper'
          - 'episodic'

# STAGE # 3
answer_aggregator:
  agent_tasks_config:
    suba_summarisation:
      - 'v2'