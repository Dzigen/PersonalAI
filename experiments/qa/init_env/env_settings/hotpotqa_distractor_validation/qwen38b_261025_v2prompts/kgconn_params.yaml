KG_MODEL_CONNECTORS:
  embeddings_struc_connection:
    nodesdb_config:
      dense_connector:
        conn:
          host: localhost
          pass: Milvus
          port: 19547
          user: root
        db_info:
          db: personalaiembeddb
          table: vectorized_nodes
        name: dense_nodes
        params:
          create_sleep: 1
          document_max_length: 51200
          flush: true
          id_length: 32
          load: true
          search_metric: IP
          vector_dim: 1024
      sparse_connector:
        conn:
          host: localhost
          pass: admin
          port: 9203
          user: admin
        db_info:
          db: personalaiembeddb
          table: bm25_nodes
        name: bm25_nodes
    tripletsdb_config:
      dense_connector:
        conn:
          host: localhost
          pass: Milvus
          port: 19547
          user: root
        db_info:
          db: personalaiembeddb
          table: vectorized_triplets
        name: dense_triplets
        params:
          create_sleep: 1
          document_max_length: 51200
          flush: true
          id_length: 32
          load: true
          search_metric: IP
          vector_dim: 1024
      sparse_connector:
        conn:
          host: localhost
          pass: admin
          port: 9203
          user: admin
        db_info:
          db: personalaiembeddb
          table: bm25_triplets
        name: bm25_triplets
  graph_struc_connection:
    db_info:
      db: personalaigraphdb
      table: personalaigraphtable
    host: localhost
    params:
      pwd: password
      user: neo4j
    port: 7707
MEM_PIPELINE_CONNECTORS:
  inference_stat_connection:
    db_info:
      db: personalaiinferencedb
      table: inferencestattable
    params:
      database_path: None
  kv_cache_connections:
    persistent_cache_config:
      db_info:
        db: personalaikvdb
        table: kvtable
      host: localhost
      params:
        max_storage: -1
        password: pass
        username: user
      port: 27037
    ram_cache_config:
      db_info:
        db: personalaikvdb
        table: kvtable
      host: localhost
      params:
        hs_name: node_pairs
        max_storage: 50000000
        password: my_user_password
        ss_name: sorted_node_pairs
        username: my_user
      port: 6399
