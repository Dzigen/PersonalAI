    answer_generator_config:
      agent_tasks_config:
        ag: v2
      relation_type:
      - simple
      - hyper
    knowledge_comparator_config:
      k_compare: 5
      max_k: 1
      reranker_driver_config:
        name: ensemble_fusion
        strategy_config:
          c: 60
          retriever_configs:
          - fetch_n: 20
            threshold: 0.5
          - fetch_n: 20
            threshold: 0.5
          vdb_names:
          - dense_nodes
          - bm25_nodes
          weights:
          - 0.2
          - 0.8
    knowledge_retriever_config:
      filter_config:
        accepted_triplets_types:
        - simple
        - hyper
        max_k: 50
        reranker_driver_config:
          name: ensemble_fusion
          strategy_config:
            c: 60
            retriever_configs:
            - fetch_n: 50
              threshold: 0.5
            - fetch_n: 50
              threshold: 0.5
            vdb_names:
            - dense_triplets
            - bm25_triplets
            weights:
            - 0.7
            - 0.3
      filter_method: naive
      retriever_config:
        accepted_node_types:
