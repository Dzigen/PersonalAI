  # NEED TO SPECIFY DATASET HYPERP-KEY/VALUES BY YOUR OWN
  max_samples_per_pack: -1

# SERVER PATHS
BASE_PERSONALAI_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI' # TO CHANGE
OLLAMA_MODELS_PATH: '/home/dzigen/Desktop/PersonalAI/ollama_volume' # TO CHANGE

INIT_STRUCT: True # !!! PAY ATTENTION !!!

########## QA PARAMS ##########

BASE_KGR_CONFIG:
  name: 'weak' # DONT CHANGE

  lang: 'en' # DONT CHANGE
  caching: True # DONT CHANGE
  cache_need_to_clear: False # !!! PAY ATTENTION !!!

  cache_db_info:
      db: 'qa_db' # DONT CHANGE
      table: None # DONT CHANGE

  agent_config:
    vendor: 'ollama' # DONT CHANGE
    gen_strategy:
      num_predict: 2048 # DONT CHANGE
      seed: 42  # DONT CHANGE
      top_k: 1  # DONT CHANGE
      temperature: 0.0  # DONT CHANGE
    credentials:
      host: 'localhost' # TO CHANGE
      port: 11434 # TO CHANGE
    ext_params:
      model: 'qwen2.5:7b'
      timeout: 560
      keep_alive: -1

  persistent_cache_config:
    vendor: 'mongo' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 27019 # TO CHANGE
    db_info:
      db: 'qa_db'
      table: None
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

  ram_cache_config:
    vendor: 'redis' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 6381 # TO CHANGE
    db_info:
      db: 1
      table: None
    params:
      ss_name: 'sorted_node_pairs'
      hs_name: 'node_pairs'
      max_storage: 50000000
      username: 'my_user'
      password: 'my_user_password'
    db_configuration: 'redis' # DONT CHANGE

WEAK_KG_REASONER:

  query_parser_config:
    kw_extraction_task:
      prompts_version: 'v2' # 'v1' | 'v2'

  knowledge_comparator_config:
    threshold: 0.5
    fetch_n: 20
    max_k: 1 # DONT CHANGE
    k_compare: 5

  knowledge_retriever_config:
    retriever_method: 'astar'
    retriever_config:
      # NEED TO SPECIFY RETRIEVER HYPERP-KEY/VALUES BY YOUR OWN
      max_depth: 10
      max_passed_nodes: 150
      accepted_node_types:
        - object
        - episodic
        - time
      metrics_config:
        h_metric_name: ip
        kvdriver_config:
          db_vendor: mixed_kv
          db_config:
            db_info:
              db: qa_db
              table: ''
            need_to_clear: false
            params:
              mongo_config:
                host: localhost
                params:
                  max_storage: -1
                  password: pass
                  username: user
                port: 27019
              redis_config:
                host: localhost
                params:
                  hs_name: node_pairs
                  max_storage: 50000000
                  password: my_user_password
                  ss_name: sorted_node_pairs
                  username: my_user
                port: 6381

    filter_method: 'naive' # CAN BE None
    filter_config: # CAN BE None
      max_k: 50
      
  answer_generator_config:
    ag_task:
      prompts_version: 'v2' # 'v1' | 'v2'

########## EVALUATION PARAMS ##########

QA_EVALUATION:
  bertscore_model_path: "google/electra-base-discriminator" # DONT CHANGE
  meteor_path: 'experiments/metrics/meteor' # DONT CHANGE
  exactmatch_path: 'experiments/metrics/exact_match' # DONT CHANGE
  llm_as_a_judge_path: 'experiments/metrics/' # DONT CHANGE

  judge_llm_config:
    caching: True # DONT CHANGE
    cache_need_to_clear: False # !!! PAY ATTENTION !!!
    cache_db_info:
      db: 'qaeval_db' # DONT CHANGE
      table: None # DONT CHANGE

    lang: 'en'
    prompts_version: 'v1'

    agent_config:
      vendor: 'ollama' # DONT CHANGE
      gen_strategy:
        num_predict: 2048 # DONT CHANGE
        seed: 42  # DONT CHANGE
        top_k: 1  # DONT CHANGE
        temperature: 0.0  # DONT CHANGE
      credentials:
        host: 'localhost' # TO CHANGE
        port: 11434 # TO CHANGE
      ext_params:
        model: 'qwen2.5:7b'
        timeout: 560
        keep_alive: -1

