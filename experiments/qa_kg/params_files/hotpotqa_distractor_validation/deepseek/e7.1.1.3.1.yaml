  entities_extractor_config:
    entities_extraction_agent_task_version: v1

  e2n_matcher_config:
    use_tree: True
    distance_threshold: 0.4
    max_n: 3
    fetch_k: 50

  cluequeries_generator_config:
    cquerie_generator_agent_task_version: v1

  knowledge_retriever_config:
    retriever_method: beamsearch
    retriever_config:
      max_depth: 2
      max_paths: 10
      same_path_intersection_by_node: False
      diff_paths_intersection_by_node: True
      diff_paths_intersection_by_rel: False
      mean_alpha: 0.75
      final_sorting_mode: mixed
      accepted_node_types:
        - object
        - hyper
        - episodic
        - time
    filter_method: naive
    filter_config:
      max_k: 50

  clueanswer_generator_config:
    cquerie_generator_agent_task_version: v3

  clueanswers_summarizer_confif:
    canswers_summarisation_agent_task_version: v1

  answer_generator_config:
    answer_classifier_agent_task_version: v1
    answer_generator_agent_task_version: v1

  max_searchplan_steps: 5

