########## QA PARAMS ##########

BASE_KGR_CONFIG:
  name: 'weak' # DONT CHANGE

  lang: 'en' # DONT CHANGE
  caching: True # DONT CHANGE
  cache_need_to_clear: False # !!! PAY ATTENTION !!!

  cache_db_info:
      db: 'qa_db' # DONT CHANGE
      table: None # DONT CHANGE

  agent_config:
    vendor: ollama
    credentials:
      model: llama3.1:8b
    ext_params:
      host: localhost
      keep_alive: -1
      port: 11439
      timeout: 560
    gen_strategy:
      num_predict: 2048
      seed: 42
      temperature: 0.0
      top_k: 1

  persistent_cache_config:
    vendor: 'mongo' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 27035 # TO CHANGE
    db_info:
      db: 'qa_db'
      table: None
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

  ram_cache_config:
    vendor: 'redis' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 6397 # TO CHANGE
    db_info:
      db: 1
      table: None
    params:
      ss_name: 'sorted_node_pairs'
      hs_name: 'node_pairs'
      max_storage: 50000000
      username: 'my_user'
      password: 'my_user_password'
    db_configuration: 'redis' # DONT CHANGE

WEAK_KG_REASONER:

  query_parser_config:
    kw_extraction_task:
      prompts_version: 'v2' # 'v1' | 'v2'

  knowledge_comparator_config:
    threshold: 0.5
    fetch_n: 20
    max_k: 1 # DONT CHANGE
    k_compare: 5

  knowledge_retriever_config:
    retriever_method: astar
    retriever_config:
      # NEED TO SPECIFY RETRIEVER HYPERP-KEY/VALUES BY YOUR OWN
      accepted_node_types:
        - object
        #- hyper
        - episodic
        - time
      max_depth: 10
      max_passed_nodes: 150
      metrics_config:
        h_metric_name: ip
        kvdriver_config:
          db_config:
            db_info:
              db: qa_db
              table: ''
            need_to_clear: false
            params:
              mongo_config:
                host: localhost
                params:
                  max_storage: -1
                  password: pass
                  username: user
                port: 27035
              redis_config:
                host: localhost
                params:
                  hs_name: node_pairs
                  max_storage: 50000000
                  password: my_user_password
                  ss_name: sorted_node_pairs
                  username: my_user
                port: 6397
          db_vendor: mixed_kv
  
    filter_method: 'naive' # CAN BE None
    filter_config: # CAN BE None
      max_k: 50
      
  answer_generator_config:
    ag_task:
      prompts_version: 'v3' # 'v1' | 'v2'

