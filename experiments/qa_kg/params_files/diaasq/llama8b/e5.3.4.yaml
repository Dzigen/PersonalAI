    fetch_n: 20
    max_k: 1 # DONT CHANGE
    k_compare: 5

  knowledge_retriever_config:
    retriever_method: beamsearch
    retriever_config:
      accepted_node_types:
      #- object
      - hyper
      - episodic
      - time
      
      max_depth: 5
      max_paths: 10
      same_path_intersection_by_node: False
      diff_paths_intersection_by_node: False
      diff_paths_intersection_by_rel: False
      mean_alpha: 0.75
      final_sorting_mode: mixed
          
    filter_method: 'naive' # CAN BE None
    filter_config: # CAN BE None
      max_k: 50

  answer_generator_config:
    ag_task:
      prompts_version: 'v3' # 'v1' | 'v2'

