EXPERIMENT_NAME: "naive_rag_qwen25_v2prompts(v1.5.0)" # TO CHANGE
DATASET_NAME: 'diaasqa' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'qwen25_080325_v2prompts' # TO CHANGE
QA_DATASET_HYPERP:
  # NEED TO SPECIFY DATASET HYPERP-KEY/VALUES BY YOUR OWN
  max_samples_per_pack: 400

BASE_PERSONALAI_DIR: '/home/m.menschikov/workspace/personal_ai/Personal-AI' # TO CHANGE
EXPERIMENTS_BASE_DIR: '/home/m.menschikov/workspace/personal_ai/Personal-AI/experiments/qa_kg' # TO CHANGE
KGS_BASE_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI/data/knowledge_graphs' # TO CHANGE
METEOR_METRIC_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI/experiments/qa_kg/metrics/meteor' # TO CHANGE
EXACT_MATCH_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI/experiments/qa_kg/metrics/exact_match' # TO CHANGE
MEM_PIPELINE_HYPERP: hyperparameters.yaml # DONT CHANGE
INIT_STRUCT: True # !!! PAY ATTENTION !!!

EVAL_BERTSCORE_MODEL: "google/electra-base-discriminator"

BASE_KGR_CONFIG:
  name: 'weak' # DONT CHANGE

  lang: 'en' # DONT CHANGE
  caching: True # DONT CHANGE
  cache_need_to_clear: False # !!! PAY ATTENTION !!!
  cache_db_info:
      db: 'qa_db'
      table: None

  agent_config:
    vendor: 'ollama' # DONT CHANGE
    gen_strategy:
      num_predict: 2048 # DONT CHANGE
      seed: 42  # DONT CHANGE
      top_k: 1  # DONT CHANGE
      temperature: 0.0  # DONT CHANGE
    credentials:
      host: 'personalai_mmenschikov_ollama_service'
      port: 11434
    ext_params:
      model: 'qwen2.5:7b'
      timeout: 560
      keep_alive: -1

  persistent_cache_config:
    vendor: 'mongo' # DONT CHANGE
    host: 'personalai_mmenschikov_mongo_cache'
    port: 27017 # DONT CHANGE
    db_info:
      db: 'qa_db'
      table: None
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

  ram_cache_config:
    vendor: 'redis' # DONT CHANGE
    host: 'personalai_mmenschikov_redis_cache'
    port: 6379 # DONT CHANGE
    db_info:
      db: 1
      table: None
    params:
      ss_name: 'sorted_node_pairs'
      hs_name: 'node_pairs'
      max_storage: 50000000
    db_configuration: '/home/m.menschikov/workspace/personal_ai/Personal-AI/configs/redis' # TO CHANGE

WEAK_KG_REASONER:

  query_parser_config:
    kw_extraction_task:
      prompts_version: 'v2'

  knowledge_comparator_config:
    threshold: 0.5
    fetch_n: 20
    max_k: 1 # DONT CHANGE
    k_compare: 5

  knowledge_retriever_config:
    retriever_method: 'naive_retriever'
    retriever_config:
      # NEED TO SPECIFY RETRIEVER HYPERP-KEY/VALUES BY YOUR OWN
    filter_method: None # CAN BE none
    filter_config:
      max_k: 50
  answer_generator_config:
    ag_task:
      prompts_version: 'v1'

QA_EXP_DIR_STRUCT:
  metrics_name: metric_packs
  tmp_gen_answers_name: tmp_answer_packs
  gen_answers_name: answer_packs

SAVE_FILES_NAMES:
  qapipeline_config: "qa_config"
  kg_reasoner_config: "kg_reasoner_config"

  hyperparameters: hyperparameters.yaml
  elapsed_time: elapsed_time.json
