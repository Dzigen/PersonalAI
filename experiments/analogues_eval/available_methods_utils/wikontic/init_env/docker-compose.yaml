services:
  ollama_agent:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CNTNAME}
    ports:
      - "${OLLAMA_EXTERNAL_PORT}:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - ${OLLAMA_LOCAL_VOLUME}:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['${OLLAMA_DEVICE_ID}']
              capabilities: [gpu]

  mongo:
    container_name: ${MONGO_CNTNAME}
    hostname: ${MONGO_HOST}
    image: mongodb/mongodb-atlas-local
    ports:
      - ${MONGO_EXTERNAL_PORT}:27017
    volumes:
      - ${MONGO_EXTERNAL_VOLUME}:/data/db
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G
        reservations:
          cpus: '2'
          memory: 5G

  workspace:
    image: m.menschikov/wikontic_eval_workspace:v1
    container_name: ${WORKSPACE_CNTNAME}
    hostname: ${WORKSPACE_HOST}
    network_mode: "host"
    volumes:
      - ${EXTERNAL_SPEC_KG_PATH}:${INTERNAL_SPEC_KG_PATH}
      - ${EXTERNAL_SPEC_DS_PATH}:${INTERNAL_SPEC_DS_PATH}
      - ${EXTERNAL_NOTEBOOKS_PATH}:${INTERNAL_NOTEBOOKS_PATH}
      - ${EXTERNAL_EXPERIMENTS_PATH}:${INTERNAL_EXPERIMENTS_PATH}
      - ${EXTERNAL_SRC_PATH}:${INTERNAL_SRC_PATH}
      - ${EXTERNAL_MODELS_PATH}:${INTERNAL_MODELS_PATH}
    depends_on:
      - mongo
    #  - ollama_agent
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 24G
        reservations:
          cpus: '2'
          memory: 16G
          devices:
            - driver: nvidia
              device_ids: ['${WORKSPACE_DEVICE_ID}']
              capabilities: [gpu]
