services:
  ollama_metrics_proxy:
    # https://github.com/elliotfehr/ollama-metrics-proxy/tree/main
    image: m.menschikov/ollama_metrics_proxy:v1
    container_name: personalai_mmenschikov_ollama_metrics_proxy
    hostname: ollamametricsproxy
    network_mode: "host"
    # ports:
    #   - ":11435" # proxy port to ollama 
    #   - ":9836" # metrics port
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  ollama_agent:
    image: ollama/ollama:latest
    container_name: ${OLLAMA_CNTNAME}
    ports:
      - "${OLLAMA_EXTERNAL_PORT}:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - ${OLLAMA_LOCAL_VOLUME}:/root/.ollama
    depends_on:
      - ollama_metrics_proxy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['${OLLAMA_DEVICE_ID}']
              capabilities: [gpu]

  workspace:
    build:
      context: .
      dockerfile: workspace.Dockerfile
    image: m.menschikov/raptor_eval_workspace:v2
    container_name: ${WORKSPACE_CNTNAME}
    hostname: ${WORKSPACE_HOST}
    network_mode: "host"
    volumes:
      - ${EXTERNAL_SPEC_KG_PATH}:${INTERNAL_SPEC_KG_PATH}
      - ${EXTERNAL_SPEC_DS_PATH}:${INTERNAL_SPEC_DS_PATH}
      - ${EXTERNAL_NOTEBOOKS_PATH}:${INTERNAL_NOTEBOOKS_PATH}
      - ${EXTERNAL_EXPERIMENTS_PATH}:${INTERNAL_EXPERIMENTS_PATH}
      - ${EXTERNAL_SRC_PATH}:${INTERNAL_SRC_PATH}
      - ${EXTERNAL_MODELS_PATH}:${INTERNAL_MODELS_PATH}
    #depends_on:
    #  - ollama_agent
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['${WORKSPACE_DEVICE_ID}']
              capabilities: [gpu]

