lang: auto
log_base_path: .
log_relative_path: log/qa/main
verbose: false
log_level: 10
preprocessor_config:
  lang: auto
  log_base_path: .
  log_relative_path: log
  verbose: false
  log_level: 10
  denoising_config:
    lang: auto
    log_base_path: .
    log_relative_path: log/qa/query_preprocessing/denoising/main
    verbose: false
    log_level: 10
    agent_gen_stategy: null
    agent_tasks_config:
      swremoval: v4
      grammarcheck: v4
    cache_table_name: qp_denoising_stage_cache
  enhancing_config: null
  decomposition_config:
    lang: auto
    log_base_path: .
    log_relative_path: log/qa/query_preprocessing/decomposition/main
    verbose: false
    log_level: 10
    agent_gen_stategy: null
    agent_tasks_config:
      classify: v4
      decompose: v4
    cache_table_name: qp_decomposition_stage_cache
  cache_table_name: query_preprocessing_main_stage_cache
  log_path: log/qa/query_preprocessing/main
reasoner_config:
  lang: auto
  log_base_path: .
  log_relative_path: log/qa/kg_reasoner/main
  verbose: false
  log_level: 10
  reasoner_name: medium
  reasoner_config:
    lang: auto
    log_base_path: .
    log_relative_path: log/qa/kg_reasoner/medium/main
    verbose: false
    log_level: 10
    searchplan_enhancer_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/plan_enhancer/main
      verbose: false
      log_level: 10
      plan_enhancment: true
      enable_enhance_classifier: false
      agent_gen_stategy: null
      agent_tasks_config:
        plan_initing: v4
        enhance_classifier: v9
        plan_enhancing: v9
        searchstop_classifier: v3
      cache_table_name: medreasn_planenh_main_stage_cache
    entities_extractor_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/entities_extractor/main
      verbose: false
      log_level: 10
      agent_gen_stategy: null
      agent_tasks_config:
        entities_extraction: v1
      max_entities: 20
      cache_table_name: medreasn_entextr_main_stage_cache
    e2n_matcher_config:
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/entities2nodes_matching/main
      verbose: false
      log_level: 10
      use_tree: false
      reranker_driver_config:
        name: ensemble_fusion
        strategy_config:
          vdb_names:
          - dense_nodes
          - bm25_nodes
          retriever_configs: null
          weights:
          - 0.3
          - 0.7
          c: 60
      max_n: 3
      discard_other_mnodes_if_exactmatch_found: true
      cache_table_name: medreasn_e2nmatcher_main_stage_cache
    cluequeries_generator_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/cluequeries_generator/main
      verbose: false
      log_level: 10
      agent_gen_stategy: null
      agent_tasks_config:
        cquerie_generator: v5
      max_cqueries_amount: 4
      return_only_unique_cqueries: false
      use_basequery_as_cqueries: false
      cache_table_name: medreasn_cquerygen_main_stage_cache
    knowledge_retriever_config:
      log_base_path: .
      log_relative_path: log/qa/knowledge_retriever/main
      verbose: false
      log_level: 10
      retriever_method: mixture
      retriever_config:
        log_base_path: .
        log_relative_path: log/qa/knowledge_retriever/mixtured_retriever
        verbose: false
        log_level: 10
        accepted_node_types:
        - object
        - hyper
        - episodic
        - time
        retriever1_name: beamsearch
        retriever1_config:
          log_base_path: .
          log_relative_path: log/qa/knowledge_retriever/beamsearch_retriever
          verbose: false
          log_level: 10
          accepted_node_types:
          - object
          - hyper
          - episodic
          reranker_driver_config:
            name: single_step
            strategy_config:
              vdb_name: dense_triplets
              fetch_n: 50
              threshold: 0.5
          vdbname_for_scores: dense_triplets
          max_depth: 3
          max_paths: 10
          same_path_intersection_by_node: false
          diff_paths_intersection_by_node: false
          diff_paths_intersection_by_rel: false
          mean_alpha: 0.75
          final_sorting_mode: mixed
          cache_table_name: qa_beamsearch_t_retriever_cache
        retriever2_name: naive_retriever
        retriever2_config:
          log_base_path: .
          log_relative_path: log/qa/knowledge_retriever/naive_retriever
          verbose: false
          log_level: 10
          accepted_node_types:
          - object
          - hyper
          - episodic
          reranker_driver_config:
            name: ensemble_fusion
            strategy_config:
              vdb_names:
              - dense_triplets
              - bm25_triplets
              retriever_configs:
              - fetch_n: 50
                threshold: null
              - fetch_n: 50
                threshold: null
              weights:
              - 0.7
              - 0.3
              c: 60
          max_k: 25
          cache_table_name: qa_naive_t_retriever_cache
        cache_table_name: qa_mixture_t_retriever_cache
      filter_method: naive
      filter_config:
        log_base_path: .
        log_relative_path: log/qa/knowledge_retriever/triples_filter
        verbose: false
        log_level: 10
        reranker_driver_config:
          name: ensemble_fusion
          strategy_config:
            vdb_names:
            - dense_triplets
            - bm25_triplets
            retriever_configs:
            - fetch_n: 25
              threshold: 0.5
            - fetch_n: 25
              threshold: 0.5
            weights:
            - 0.9
            - 0.1
            c: 60
        accepted_triplets_types:
        - hyper
        - simple
        max_k: 25
        cache_table_name: qa_naive_t_filter_cache
      cache_table_name: qa_kretriever_stage_cache
    clueanswer_generator_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/clueansw_generation/main
      verbose: false
      log_level: 10
      agent_gen_stategy: null
      agent_tasks_config:
        cagen: v6
      cache_table_name: medreasn_cagen_main_stage_cache
    clueanswers_summarizer_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/clueanswers_summarisation/main
      verbose: false
      log_level: 10
      agent_gen_stategy: null
      agent_tasks_config:
        canswers_summarisation: v5
      cache_table_name: medreasn_cquerysumm_main_stage_cache
    answer_generator_config:
      lang: auto
      log_base_path: .
      log_relative_path: log/qa/kg_reasoner/medium/answer_generation/main
      verbose: false
      log_level: 10
      agent_gen_stategy: null
      agent_tasks_config:
        answer_classifier: v4
        strict_answer_generator: v4
        casual_answer_generator: v2
      relinfo_found_behaviour: casual_answer
      cache_table_name: medreasn_answgen_main_stage_cache
    max_searchplan_steps: 8
    enable_searchplan_steps_check: true
    planlimit_exceeded_behaviour: strict_answer
    cache_table_name: qa_mediumreasoner_cache
aggregator_config:
  lang: auto
  log_base_path: .
  log_relative_path: log/qa/answers_aggregation/main
  verbose: false
  log_level: 10
  agent_gen_stategy: null
  agent_tasks_config:
    strict_suba_summarisation: v4
    casual_suba_summarisation: v2
  answers_summ_behaviour: strict_answer
  cache_table_name: answers_aggregation_main_stage_cache
cache_table_name: qa_pipeline_cache
