lang: auto
log_path: log/qa/kg_reasoner/weak/main
verbose: false
log_level: 10
query_parser_config:
  lang: auto
  log_path: log/qa/kg_reasoner/weak/query_parser/main
  verbose: false
  log_level: 10
  agent_gen_stategy: null
  agent_tasks_config:
    kw_extraction: v2
  max_entities: 20
  cache_table_name: qa_queryparser_stage_cache
knowledge_comparator_config:
  log_path: log/qa/kg_reasoner/weak/knowledge_comparator
  verbose: false
  log_level: 10
  reranker_driver_config:
    name: ensemble_fusion
    strategy_config:
      vdb_names:
      - dense_nodes
      - bm25_nodes
      retriever_configs: null
      weights:
      - 0.3
      - 0.7
      c: 60
  max_k: 3
  discard_other_mnodes_if_exactmatch_found: true
  k_compare: 5
  cache_table_name: qa_kcomparator_stage_cache
knowledge_retriever_config:
  log_path: log/qa/kg_reasoner/weak/knowledge_retriever/main
  verbose: false
  log_level: 10
  retriever_method: mixture
  retriever_config:
    log_path: log/qa/kg_reasoner/weak/knowledge_retriever/mixtured_retriever
    verbose: false
    log_level: 10
    accepted_node_types:
    - object
    - hyper
    - episodic
    - time
    retriever1_name: beamsearch
    retriever1_config:
      log_path: log/qa/kg_reasoner/weak/knowledge_retriever/beamsearch_retriever
      verbose: false
      log_level: 10
      accepted_node_types:
      - object
      - hyper
      - episodic
      reranker_driver_config:
        name: single_step
        strategy_config:
          vdb_name: dense_triplets
          fetch_n: 25
          threshold: 0.5
      vdbname_for_scores: dense_triplets
      max_depth: 5
      max_paths: 10
      same_path_intersection_by_node: false
      diff_paths_intersection_by_node: false
      diff_paths_intersection_by_rel: false
      mean_alpha: 0.75
      final_sorting_mode: mixed
      cache_table_name: qa_beamsearch_t_retriever_cache
    retriever2_name: watercircles
    retriever2_config:
      log_path: log/qa/kg_reasoner/weak/knowledge_retriever/watercircles_retriever
      verbose: false
      log_level: 10
      accepted_node_types:
      - object
      - hyper
      - episodic
      strict_filter: true
      hyper_num: 25
      episodic_num: 15
      chain_triplets_num: 25
      other_triplets_num: 6
      do_text_pruning: false
      cache_table_name: qa_watercircles_t_retriever_cache
    cache_table_name: qa_mixture_t_retriever_cache
  filter_method: naive
  filter_config:
    log_path: log/qa/kg_reasoner/weak/knowledge_retriever/triples_filter
    verbose: false
    log_level: 10
    reranker_driver_config:
      name: ensemble_fusion
      strategy_config:
        vdb_names:
        - dense_triplets
        - bm25_triplets
        retriever_configs:
        - fetch_n: 50
          threshold: 0.5
        - fetch_n: 50
          threshold: 0.5
        weights:
        - 0.9
        - 0.1
        c: 60
    accepted_triplets_types:
    - hyper
    - simple
    max_k: 50
    cache_table_name: qa_naive_t_filter_cache
  cache_table_name: qa_kretriever_stage_cache
answer_generator_config:
  lang: auto
  log_path: log/qa/kg_reasoner/weak/answer_generation/main
  verbose: false
  log_level: 10
  agent_gen_stategy: null
  agent_tasks_config:
    ag: v3
  relation_type:
  - hyper
  - simple
  cache_table_name: qa_agenerator_stage_cache
cache_table_name: qa_weakreasoner_cache
