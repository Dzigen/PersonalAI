lang: auto
log_path: log/kg_model/nodes_tree
verbose: false
log_level: 10
leafnodes_vdb_driver_configs_mapping:
  leaf_dense_nodes:
    db_vendor: chroma
    vector_category: dense
    db_config:
      db_info:
        db: default_db
        table: vectorized_leafnodes
      params:
        hnsw:space: ip
        hnsw:M: 4096
      need_to_clear: false
      create_index: false
      conn:
        path: ./personalai_tmp/graph_structures/tree_model/vectorized_leaf_nodes/chroma/default_densedb
  leaf_bm25_nodes:
    db_vendor: inmemory
    vector_category: sparse_bm25
    db_config:
      db_info:
        db: default_db
        table: sparsebm25_lnodes
      params:
        store_dump_name: inmemory_bm25
        load_from_disk: true
        load_dump_name: null
        load_dump_dir: ./personalai_tmp/graph_structures/tree_model/vectorized_leaf_nodes/inmemory_bm25
        save_on_disk: true
        save_dump_dir: ./personalai_tmp/graph_structures/tree_model/vectorized_leaf_nodes/inmemory_bm25
      need_to_clear: false
      create_index: false
      conn: {}
leafnodes_reranker_driver_config:
  name: ensemble_fusion
  strategy_config:
    vdb_names:
    - leaf_dense_nodes
    - leaf_bm25_nodes
    retriever_configs: null
    weights:
    - 0.6
    - 0.4
    c: 60
leafnodes_scores_vdbname: leaf_dense_nodes
summnodes_vdb_driver_configs_mapping:
  summ_dense_nodes:
    db_vendor: chroma
    vector_category: dense
    db_config:
      db_info:
        db: default_db
        table: vectorized_summarizednodes
      params:
        hnsw:space: ip
        hnsw:M: 4096
      need_to_clear: false
      create_index: false
      conn:
        path: ./personalai_tmp/graph_structures/tree_model/vectorized_summ_nodes/chroma/default_densedb
  summ_bm25_nodes:
    db_vendor: inmemory
    vector_category: sparse_bm25
    db_config:
      db_info:
        db: default_db
        table: sparsebm25_snodes
      params:
        store_dump_name: inmemory_bm25
        load_from_disk: true
        load_dump_name: null
        load_dump_dir: ./personalai_tmp/graph_structures/tree_model/vectorized_summ_nodes/inmemory_bm25
        save_on_disk: true
        save_dump_dir: ./personalai_tmp/graph_structures/tree_model/vectorized_summ_nodes/inmemory_bm25
      need_to_clear: false
      create_index: false
      conn: {}
summnodes_reranker_driver_config:
  name: ensemble_fusion
  strategy_config:
    vdb_names:
    - summ_dense_nodes
    - summ_bm25_nodes
    retriever_configs: null
    weights:
    - 0.6
    - 0.4
    c: 60
summnodes_scores_vdbname: summ_dense_nodes
treedb_config:
  db_vendor: kuzu
  db_config:
    db_info:
      db: DefaultDB
      table: KuzuTree
    params:
      path: ./personalai_tmp/memory_parts/tree_model/tree_struct/kuzu
      buffer_pool_size: 1073741824
      table_type_map:
        nodes:
          forward:
            root: root
            leaf: leaf
            summarized: summarized
    need_to_clear: false
    create_index: false
    host: null
    port: null
agent_gen_stategy: null
agent_tasks_config:
  nodes_summarization: v1
e2n_base_threshold: 0.3
depth_rate: 0.4
nodes_aggregation_mechanism: sequencial
