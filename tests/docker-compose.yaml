services:
  neo4j:
    container_name: personalai_test_neo4j
    image: neo4j:5.21.0-enterprise
    hostname: personalai_test_neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ./volumes/neo4j:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  aerospike:
    container_name: personalai_test_aerospike
    hostname: personalai_test_aerospike
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./volumes/aerospike:/opt/aerospike/data
      - ../configs/aerospike:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  mongo:
    container_name: personalai_test_mongo
    image: mongo:7.0.9
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    ports:
      - "27018:27017"
    volumes:
      - ./volumes/mongo:/data/db
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  redis:
    container_name: personalai_test_redis
    image: redis:latest
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=my_redis_password
      - REDIS_USER=my_user
      - REDIS_USER_PASSWORD=my_user_password
    ports:
      - "6381:6379"
    volumes:
      - ../configs/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./volumes/redis:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  isolated_environment:
    image: m.menschikov/empty_workspace:v1
    container_name: personalai_test_isolated_env
    hostname: test_isolated_env
    volumes:
      - ../src:/home/workspace/src
      - ../data:/home/workspace/data
      - ../models:/home/workspace/models
      - ../tests:/home/workspace/tests
      - ../configs:/home/workspace/configs
    depends_on:
      - neo4j
      - aerospike
      - redis
      - mongo
