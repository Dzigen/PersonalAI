services:
  neo4j:
    container_name: personalai_mmenschikov_test_neo4j
    image: neo4j:5.21.0-enterprise
    hostname: personalai_mmenschikov_test_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ./volumes/neo4j:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  aerospike:
    container_name: personalai_test_aerospike
    hostname: personalai_test_aerospike
    image: m.menschikov/aerospike:ee-7.1.0.6_1
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    volumes:
      - ./volumes/aerospike:/opt/aerospike/data
      - ../configs/aerospike:/etc/aerospike
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  isolated_environment:
    image: m.menschikov/empty_workspace:v1
    container_name: personalai_mmenschikov_isolated_env
    hostname: isolated_env
    volumes:
      - ../src:/home/workspace/src
      - ../data:/home/workspace/data
      - ../models:/home/workspace/models
      - ../tests:/home/workspace/tests
      - ../configs:/home/workspace/configs
    depends_on:
      - neo4j
      - aerospike
