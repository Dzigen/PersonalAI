services:

  # Database - Neo4j
  neo4j:
    container_name: personalai_mmenschikov_neo4j
    #user: "4200235:4200235"
    image: neo4j:5.21.0-enterprise
    hostname: localhost
    ports:
      - 7474:7474
      - 7680:7687
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ../../personalai_volumes/neo4j:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  blazegraph:
    container_name: personalai_mmenschikov_blazegraph
    image: lyrasis/blazegraph:2.1.4
    hostname: localhost
    ports:
      - 8889:8080
      - 9999:9999
    environment:
      - Djetty.port=9999
      - ES_JAVA_OPTS=-server -Xmx4g
    volumes:
      - ../configs/blazegraph/RWStore.properties:/RWStore.properties
      - ../../personalai_volumes/blazegraph:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  falkordb:
    container_name: personalai_mmenschikov_falkordb
    image: falkordb/falkordb:latest
    hostname: localhost
    # networks:
    #   - tests_network
    ports:
      - 6379:6379
      - 3000:3000
    environment:
      - FALKORDB_ARGS=THREAD_COUNT 8 TIMEOUT_MAX 30000
    volumes:
      - ../../personalai_volumes/falkordb:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  # milvus:
  #   image: milvusdb/milvus:v2.5.8
  #   container_name: personalai_mmenschikov_milvus
  #   hostname: localhost
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     - ETCD_USE_EMBED=true
  #     - ETCD_DATA_DIR=/var/lib/milvus/etcd
  #     - ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml
  #     - COMMON_STORAGETYPE=local
  #   ports:
  #     - 19530:19530
  #     - 2379:2379
  #     - 9091:9091
  #   volumes:
  #     - ../../personalai_volumes/milvus:/var/lib/milvus
  #     - ../configs/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
