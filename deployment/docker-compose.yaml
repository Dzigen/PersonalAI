services:

  # Database - Neo4j
  neo4j:
    container_name: personalai_mmenschikov_neo4j
    #user: "4200235:4200235"
    image: neo4j:5.21.0-enterprise
    hostname: localhost
    ports:
      - 7474:7474
      - 7680:7687
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ${NEO4J_EXTRNAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  blazegraph:
    container_name: personalai_mmenschikov_blazegraph
    image: lyrasis/blazegraph:2.1.4
    hostname: localhost
    ports:
      - 8889:8080
      - 9999:9999
    environment:
      - Djetty.port=9999
      - ES_JAVA_OPTS=-server -Xmx4g
    volumes:
      - ${BLAZEGRAPH_EXTERNAL_CONFIG_PATH}:/RWStore.properties
      - ${BLAZEGRAPH_EXTERNAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  falkordb:
    container_name: personalai_mmenschikov_falkordb
    image: falkordb/falkordb:latest
    hostname: localhost
    # networks:
    #   - tests_network
    ports:
      - 6379:6379
      - 3000:3000
    environment:
      - FALKORDB_ARGS=THREAD_COUNT 8 TIMEOUT_MAX 30000
    volumes:
      - ${FALKORDB_EXTERNAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  # milvus:
  #   image: milvusdb/milvus:v2.5.8
  #   container_name: personalai_mmenschikov_milvus
  #   hostname: localhost
  #   command: ["milvus", "run", "standalone"]
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     - ETCD_USE_EMBED=true
  #     - ETCD_DATA_DIR=/var/lib/milvus/etcd
  #     - ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml
  #     - COMMON_STORAGETYPE=local
  #   ports:
  #     - 19530:19530
  #     - 2379:2379
  #     - 9091:9091
  #   volumes:
  #     - ../../personalai_volumes/milvus:/var/lib/milvus
  #     - ../configs/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
  #     - ../configs/milvus/user.yaml:/milvus/configs/user.yaml
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     interval: 30s
  #     start_period: 90s
  #     timeout: 20s
  #     retries: 3
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2'
  #         memory: 10G
  #       reservations:
  #         cpus: '1'
  #         memory: 5G

  opensearch:
    container_name: personalai_mmenschikov_opensearch
    image: opensearchproject/opensearch:2.11.0
    hostname: localhost
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    volumes:
      - ${OPENSEARCH_EXTERNAL_VOLUME}:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  elasticsearch:
    container_name: personalai_mmenschikov_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    hostname: localhost
    ports:
      - 9201:9200
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    volumes:
      - ${ELASTICSEARCH_EXTERNAL_VOLUME}:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  weaviate:
      container_name: personalai_mmenschikov_weaviate
      image: semitechnologies/weaviate:1.30.17
      hostname: localhost
      ports:
      - 8083:8080
      - 50051:50051
      command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
      volumes:
        - ${WEAVIATE_EXTERNAL_VOLUME}:/var/lib/weaviate
      environment:
        QUERY_DEFAULTS_LIMIT: 25
        AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
        PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
        DEFAULT_VECTORIZER_MODULE: 'none'
        ENABLE_MODULES: ''
        CLUSTER_HOSTNAME: 'node1'
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 10G
          reservations:
            cpus: '1'
            memory: 5G

  qdrant:
    container_name: personalai_mmenschikov_qdrant
    image: qdrant/qdrant
    hostname: localhost
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
        - ${QDRANT_EXTERNAL_VOLUME}:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  mysql:
    image: mysql:8.0
    container_name: personalai_mmenschikov_mysql
    hostname: localhost
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: personalai
      MYSQL_USER: personalai
      MYSQL_PASSWORD: personalai
    volumes:
      - ${MYSQL_EXTERNAL_VOLUME}:/var/lib/mysql
      - ${MYSQL_EXTERNAL_CONFIG_PATH}:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 3306:3306
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  postgresql:
    image: postgres:16
    container_name: personalai_mmenschikov_postgresql
    hostname: localhost
    environment:
      POSTGRES_DB: personalai
      POSTGRES_USER: personalai
      POSTGRES_PASSWORD: personalai
    volumes:
      - ${POSTGRESQL_EXTERNAL_VOLUME}:/var/lib/postgresql/data # Mounts a host directory for persistent data storage
      - ${POSTGRESQL_EXTERNAL_CONFIG_PATH}:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  mongo:
    container_name: personalai_mmenschikov_mongo
    image: mongo:7.0.9
    hostname: localhost
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=pass
    ports:
      - 27017:27017
    volumes:
      - ${MONGO_EXTERNAL_VOLUME}:/data/db
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G
    tty: true
    stdin_open: true

  redis:
    container_name: personalai_mmenschikov_redis
    image: redis:latest
    hostname: localhost
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=my_redis_password
      - REDIS_USER=my_user
      - REDIS_USER_PASSWORD=my_user_password
    ports:
      - 6380:6379
    volumes:
      - ${REDIS_EXTERNAL_CONFIG_PATH}:/usr/local/etc/redis/redis.conf
      - ${REDIS_EXTERNAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
    tty: true
    stdin_open: true

  workspace:
    build:
      context: .
      dockerfile: workspace.Dockerfile
    image: m.menschikov/workspace:v13
    container_name: personalai_mmenschikov_workspace
    hostname: workspaceservice
    network_mode: "host"
    volumes:
      - ${EXTERNAL_DATASETS_PATH}:${EXTERNAL_DATASETS_PATH}
      - ${EXTERNAL_SRC_PATH}:${INTERNAL_SRC_PATH}
      - ${EXTERNAL_EXPERIMENTS_PATH}:${INTERNAL_EXPERIMENTS_PATH}
      - ${EXTRNAL_NOTEBOOKS_PATH}:${INTERNAL_NOTEBOOKS_PATH}
      - ${EXTERNAL_KNOWLEDGE_GRAPHS_PATH}:${INTERNAL_KNOWLEDGE_GRAPHS_PATH}
      - ${EXTERNAL_MODELS_PATH}:${INTERNAL_MODELS_PATH}
      - ${EXTERNAL_EXPERIMENT_RESULTS_PATH}:${INTERNAL_EXPERIMENT_RESULTS_PATH}
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['${WORKSPACE_DEVICE_ID}']
              capabilities: [gpu]

  empty_workspace:
    image: m.menschikov/empty_workspace:v1
    container_name: ${EMPTY_WORKSPACE_CNTNAME}
    hostname: ${EMPTY_WORKSPACE_HOST}
    volumes:
      - ${BASE_PERSONALAI_PATH}:${BASE_PERSONALAI_PATH}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  ollama_agent:
    image: ollama/ollama:latest
    container_name: personalai_mmenschikov_ollama
    ports:
      - "11437:11434"
    environment: # available variables: https://github.com/ollama/ollama/issues/2941
      - OLLAMA_DEBUG=1
      - OLLAMA_NOHISTORY=0
      #- OLLAMA_NUM_PARALLEL=4      # Processes up to 4 requests at once per model
      #- OLLAMA_MAX_LOADED_MODELS=2  # Keeps up to 2 different models in VRAM
      #- OLLAMA_FLASH_ATTENTION=1    # Strongly recommended to save VRAM during parallel loads
    volumes:
      - ${OLLAMA_EXTERNAL_VOLUME_PATH}:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 32G
        reservations:
          cpus: '3'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['${OLLAMA_DEVICE_ID}']
              capabilities: [gpu]
