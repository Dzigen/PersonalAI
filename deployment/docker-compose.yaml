  #         memory: 5G

  opensearch:
    container_name: personalai_mmenschikov_opensearch
    image: opensearchproject/opensearch:2.11.0
    hostname: localhost
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    volumes:
      - ../../personalai_volumes/opensearch:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  elasticsearch:
    container_name: personalai_mmenschikov_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    hostname: localhost
    ports:
      - 9201:9200
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    volumes:
      - ../../personalai_volumes/elasticsearch:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  weaviate:
      container_name: personalai_mmenschikov_weaviate
      image: semitechnologies/weaviate:1.30.17
      hostname: localhost
      ports:
      - 8083:8080
      - 50051:50051
      command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
      volumes:
        - ../../personalai_volumes/weaviate:/var/lib/weaviate
      environment:
        QUERY_DEFAULTS_LIMIT: 25
        AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
        PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
        DEFAULT_VECTORIZER_MODULE: 'none'
        ENABLE_MODULES: ''
        CLUSTER_HOSTNAME: 'node1'
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 10G
          reservations:
            cpus: '1'
            memory: 5G

  qdrant:
    container_name: personalai_mmenschikov_qdrant
    image: qdrant/qdrant
    hostname: localhost
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
        - ../../personalai_volumes/qdrant:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  mysql:
    image: mysql:8.0
    container_name: personalai_mmenschikov_mysql
    hostname: localhost
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: personalai
      MYSQL_USER: personalai
      MYSQL_PASSWORD: personalai
    volumes:
      - ../../personalai_volumes/mysql:/var/lib/mysql
      - ../configs/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 3306:3306
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  postgresql:
    image: postgres:16
    container_name: personalai_mmenschikov_test_postgresql
    hostname: localhost
    environment:
      POSTGRES_DB: personalai_test
      POSTGRES_USER: personalai
      POSTGRES_PASSWORD: personalai
    volumes:
      - ../../personalai_volumes/postgresql:/var/lib/postgresql/data # Mounts a host directory for persistent data storage
      - ../configs/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G



  workspace:
    image: m.menschikov/workspace:v5
    container_name: personalai_mmenschikov_workspace
    hostname: worksapceservice
    volumes:
      - ../data/qa_datasets:/home/m.menschikov/workspace/personal_ai/Personal-AI/data/qa_datasets #/home/dzigen/Desktop/PersonalAI/Personal-AI/data/qa_datasets | /home/m.menschikov/workspace/personal_ai/Personal-AI/data/qa_datasets
      - ../src:/home/m.menschikov/workspace/personal_ai/Personal-AI/src #/home/dzigen/Desktop/PersonalAI/Personal-AI/src | /home/m.menschikov/workspace/personal_ai/Personal-AI/src
      - ../experiments:/home/m.menschikov/workspace/personal_ai/Personal-AI/experiments #/home/dzigen/Desktop/PersonalAI/Personal-AI/experiments | /home/m.menschikov/workspace/personal_ai/Personal-AI/experiments
      - ../notebooks:/home/m.menschikov/workspace/personal_ai/Personal-AI/notebooks #/home/dzigen/Desktop/PersonalAI/Personal-AI/notebooks | /home/m.menschikov/workspace/personal_ai/Personal-AI/notebooks
      - /mnt/data/m.menschikov/personalai/knowledge_graphs:/home/m.menschikov/workspace/personal_ai/Personal-AI/data/knowledge_graphs
      - /mnt/data/m.menschikov/personalai/models:/home/m.menschikov/workspace/personal_ai/Personal-AI/models
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  empty_workspace:
    image: m.menschikov/empty_workspace:v1
    container_name: ${EMPTY_WORKSPACE_CNTNAME}
    hostname: ${EMPTY_WORKSPACE_HOST}
    volumes:
      - ${BASE_PERSONALAI_PATH}:${BASE_PERSONALAI_PATH}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  ollama_agent:
    image: ollama/ollama:latest
    container_name: personalai_mmenschikov_ollama
    ports:
      - "11437:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - /mnt/data/m.menschikov/ollama_volume:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 32G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
