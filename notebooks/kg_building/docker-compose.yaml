services:

  # Database - Neo4j
  neo4j:
    container_name: personalai_mmenschikov_neo4j
    image: neo4j:5.21.0-enterprise
    hostname: personalai_mmenschikov_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ${LOCAL_NEO4J_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  mongo_cache:
    image: mongo:latest
    container_name: personalai_mmenschikov_mongo_cache
    hostname: mongo_cache
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    ports:
      - "27017:27017"
    volumes:
      - ${LOCAL_MONGO_VOLUME}:/data/db/
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 40G
        reservations:
          cpus: '1'
          memory: 5G

  mongo_ui:
    image: mongo-express:latest
    container_name: personalai_mmenschikov_mongo_ui
    hostname: mongo_ui
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: me_user
      ME_CONFIG_BASICAUTH_PASSWORD: me_pass
      ME_CONFIG_MONGODB_ADMINUSERNAME: user
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_SERVER: mongo_cache
    depends_on:
      - mongo_cache
    ports:
      - "8081:8081"

  redis_cache:
    image: redis:latest
    container_name: personalai_mmenschikov_redis_cache
    hostname: redis_cache
    ports:
      - "6380:6379"
    volumes:
      - ${LOCAL_REDIS_VOLUME}:/data
      - ${LOCAL_REDIS_CONFIG}:/usr/local/etc/redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 6G

  redis_ui:
    image: redis/redisinsight:latest
    container_name: personalai_mmenschikov_redis_ui
    hostname: redis_ui
    depends_on:
      - redis_cache
    ports:
      - "5540:5540"

  workspace:
    image: m.menschikov/workspace:v1
    container_name: personalai_mmenschikov_worksapce
    hostname: worksapceservice
    ports:
      - "10888:10888"
    volumes:
      - ${LOCAL_WORKSPACE_DIR}:/home/m.menschikov/workspace
    depends_on:
      - neo4j
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
