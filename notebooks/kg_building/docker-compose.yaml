services:

  neo4j:
    container_name: ${NEO4J_HOST}
    image: neo4j:5.21.0-enterprise
    hostname: ${NEO4J_HOST}
    ports:
      - 7474:7474
      - ${NEO4J_EXTERNAL_PORT}:7687
    environment:
      - NEO4J_AUTH=${NEO4j_AUTH_USER}/${NEO4j_AUTH_PWD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ${NEO4J_LOCAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  mongo_cache:
    image: mongo:latest
    container_name: ${MONGO_HOST}
    hostname: ${MONGO_HOST}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_AUTH_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_AUTH_PWD}
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    volumes:
      - ${MONGO_LOCAL_VOLUME}:/data/db/
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 40G
        reservations:
          cpus: '1'
          memory: 5G

  mongo_ui:
    image: mongo-express:latest
    container_name: personalai_mmenschikov_mongo_ui
    hostname: mongo_ui
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: me_user
      ME_CONFIG_BASICAUTH_PASSWORD: me_pass
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_AUTH_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_AUTH_PWD}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
    depends_on:
      - mongo_cache
    ports:
      - "8081:8081"

  redis_cache:
    image: redis:latest
    container_name: ${REDIS_HOST}
    hostname: redis_cache
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - ${REDIS_LOCAL_VOLUME}:/data
      - ${REDIS_CONFIG}:/usr/local/etc/redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 6G

  redis_ui:
    image: redis/redisinsight:latest
    container_name: personalai_mmenschikov_redis_ui
    hostname: redis_ui
    depends_on:
      - redis_cache
    ports:
      - "5540:5540"

  ollama_agent:
    image: ollama/ollama:latest
    container_name: ${LLMAGENTS_HOST}
    hostname: ${LLMAGENTS_HOST}
    ports:
      - "${LLMAGENTS_EXTERNAL_PORT}:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - ${LLMAGENT_LOCAL_VOLUME}:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]


  workspace:
    image: m.menschikov/workspace:v1
    container_name: personalai_mmenschikov_worksapce
    hostname: worksapceservice
    volumes:
      - ${LOCAL_WORKSPACE_DIR}:/home/m.menschikov/workspace/personal_ai/Personal-AI
      - ${LOCAL_VENV_DIR}:/home/m.menschikov/workspace/personal_ai/.pai_venv
    depends_on:
      - neo4j
      - mongo_ui
      - redis_ui
      - ollama_agent
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
