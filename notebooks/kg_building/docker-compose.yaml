services:

  neo4j:
    image: neo4j:5.21.0-enterprise
    container_name: ${NEO4J_HOST}
    hostname: ${NEO4J_HOST}
    ports:
      - ${NEO4J_UI_EXTERNAL_PORT}:7474
      - ${NEO4J_EXTERNAL_PORT}:7687
    environment:
      - NEO4J_AUTH=${NEO4j_AUTH_USER}/${NEO4j_AUTH_PWD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ${NEO4J_LOCAL_VOLUME}:/data
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G
        reservations:
          cpus: '2'
          memory: 5G

  mongo_cache:
    image: mongo:latest
    container_name: ${MONGO_HOST}
    hostname: ${MONGO_HOST}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_AUTH_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_AUTH_PWD}
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    volumes:
      - ${MONGO_LOCAL_VOLUME}:/data/db/
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 40G
        reservations:
          cpus: '2'
          memory: 5G

  mongo_ui:
    image: mongo-express:latest
    container_name: ${MONGO_UI_HOST}
    hostname: ${MONGO_UI_HOST}
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: me_user
      ME_CONFIG_BASICAUTH_PASSWORD: me_pass
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_AUTH_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_AUTH_PASS}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
    depends_on:
      - mongo_cache
    ports:
      - ${MONGO_UI_EXTERNAL_PORT}:8081

  redis_cache:
    image: redis:latest
    container_name: ${REDIS_HOST}
    hostname: ${REDIS_HOST}
    environment:
      - REDIS_PASSWORD=my_redis_password
      - REDIS_USER=${REDIS_AUTH_USER}
      - REDIS_USER_PASSWORD=${REDIS_AUTH_PASS}
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - ${REDIS_LOCAL_VOLUME}:/data
      - ${REDIS_CONFIG}:/usr/local/etc/redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          cpus: '1'
          memory: 5G

  redis_ui:
    image: redis/redisinsight:latest
    container_name: ${REDIS_UI_HOST}
    hostname: ${REDIS_UI_HOST}
    depends_on:
      - redis_cache
    ports:
      - ${REDIS_UI_EXTERNAL_PORT}:5540

  ollama_agent:
    image: ollama/ollama:latest
    container_name: ${LLMAGENTS_HOST}
    hostname: ${LLMAGENTS_HOST}
    ports:
      - "${LLMAGENTS_EXTERNAL_PORT}:11434"
    environment:
      - OLLAMA_DEBUG=1
    volumes:
      - ${LLMAGENT_LOCAL_VOLUME}:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  workspace:
    image: m.menschikov/workspace:v1
    container_name: ${WORKSPACE_HOST}
    hostname: ${WORKSPACE_HOST}
    volumes:
      - ${KG_DIR}:${KG_DIR}
      - ${QA_DATASET}:${QA_DATASET}
      - ${NOTEBOOKS}:${NOTEBOOKS}
      - ${SRC}:${SRC}
      - ${MODELS}:${MODELS}
    depends_on:
      - neo4j
      - mongo_ui
      - redis_ui
      - ollama_agent
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '8'
          memory: 24G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    empty_workspace:
      image: m.menschikov/empty_workspace:v1
      container_name: ${EMPTY_WORKSPACE_HOST}
      hostname: ${EMPTY_WORKSPACE_HOST}
      volumes:
        - ${BASE_PERSONALAI_PATH}:${BASE_PERSONALAI_PATH}
      deploy:
        resources:
          limits:
            cpus: '2'
            memory: 8G
          reservations:
            cpus: '1'
            memory: 4G
