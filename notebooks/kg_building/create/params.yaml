DATASET_NAME: 'trivia_qa_rcwikipedia_validation' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'qwen25_110325_v2prompts' # TO CHANGE

# SERVER PATHS
BASE_PERSONALAI_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI' # TO CHANGE
OLLAMA_MODELS_PATH: '/home/dzigen/Desktop/PersonalAI/ollama_volume' # TO CHANGE

INIT_STRUCT: False # !!! PAY ATTENTION !!!

MEM_PIPELINE_CONFIG:
  lang: 'en' # DONT CHANGE

  llm_caching: True # DONT CHANGE
  cache_need_to_clear: False # !!! PAY ATTENTION !!!
  cache_db_info:
      db: 'memorize_db'
      table: None

  agent_config:
    vendor: 'ollama' # DONT CHANGE
    gen_strategy:
      num_predict: 2048 # DONT CHANGE
      seed: 42  # DONT CHANGE
      top_k: 1  # DONT CHANGE
      temperature: 0.0  # DONT CHANGE
    credentials:
      host: 'personalai_mmenschikov_ollama_service' # TO CHANGE
      port: 11434 # TO CHANGE
    ext_params:
      model: 'qwen2.5:7b' # TO CHANGE
      timeout: 560
      keep_alive: -1

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2' # TO CHANGE
    extract_thesises:
      prompts_version: 'v2' # TO CHANGE

  updator_stage:
    delete_obsolete_info: False # DONT CHANGE
    replace_simple_triplets:
      prompts_version: 'v1' # DONT CHANGE
    replace_thesis_triplets:
      prompts_version: 'v1' # DONT CHANGE

  persistent_cache_config:
    vendor: 'mongo' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 27017 # TO CHANGE
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

  ram_cache_config:
    vendor: 'redis' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 6379 # TO CHANGE
    params:
      ss_name: 'sorted_node_pairs'
      hs_name: 'node_pairs'
      max_storage: 50000000
      username: 'my_user'
      password: 'my_user_password'
    db_configuration: 'redis'

KG_DB_CONFIGS:
  need_to_clear: False # !!! PAY ATTENTION !!!

  graphdb_config:
    vendor: 'neo4j' # DONT CHANGE
    host: 'localhost' # TO CHANGE
    port: 7687 # TO CHANGE
    params:
      user: 'neo4j'
      pwd: 'password'
    db_info:
      db: 'knowledgegraphdb'
      table: 'knowledgegraphtable'

  nodesdb_config:
    vendor: 'chroma' # DONT CHANGE
    db_info:
      db: 'knowledgegraphdb'
      table: 'vectorized_nodes'

  tripletsdb_config:
      vendor: 'chroma' # DONT CHANGE
      db_info:
        db: 'knowledgegraphdb'
        table: 'vectorized_triplets'

  embedder_config:
    prompts:
      query: "query: "
      passage: "passage: "
    model_name_or_path: 'intfloat/multilingual-e5-large'

CONTAINERS_ADDITIONAL_CONFIG:
  workspace_cntname: 'personalai_mmenschikov_workspace'
  workspace_host: 'personalai_mmenschikov_workspace' # TO CHANGE

  redis_cntname: 'personalai_mmenschikov_redis'
  redis_ui_cntname: 'personalai_mmenschikov_redis_ui'
  redis_ui_host: 'personalai_mmenschikov_redis_ui' # TO CHANGE
  redis_ui_port: 5540 # TO CHANGE

  mongo_cntname: 'personalai_mmenschikov_mongo'
  mongo_ui_cntname: 'personalai_mmenschikov_mongo_ui' # TO CHANGE
  mongo_ui_host: 'personalai_mmenschikov_mongo_ui' # TO CHANGE
  mongo_ui_port: 8081 # TO CHANGE

  neo4j_cntname: 'personalai_mmenschikov_neo4j'
  neo4j_ui_port: 7474 # TO CHANGE

  agent_cntname: 'personalai_mmenschikov_ollama_service'

########## HARDCODED PARAMS ##########

KG_DIR_STRUCT:
  embeddings_part: embeddings_part
  graph_part: graph_part
  cache_dir:
    base: kv_cache
    persistant: persistent_volume
    ram: ram_volume

PERSONALAI_REPO_DIRS:
  kg: 'data/knowledge_graphs'
  qa_datasets: 'data/qa_datasets'
  notebooks: 'notebooks'
  src: 'src'
  models: 'models'
  configs: 'configs'

WORKSPACE_CONTAINER_DIRS:
  base_path: '/home/workspace'
  kg: 'data/knowledge_graphs'
  qa_datasets: 'data/qa_datasets'
  notebooks: 'notebooks'
  src: 'src'
  models: 'models'

SAVE_CONFIGS_NAMES:
  graph_config: graph_config
  embeddings_config: embeddings_config
  mem_pipeline_config: mem_pipeline_config
  kvdriver_cache_config: kvdriver_cache_config
  docker_compose_env: .env

  hyperparameters: hyperparameters.yaml
  tmp_extracted_triplets: tmp_extracted_triplets
  extracted_triplets: extracted_triplets

  graph_statistics_dir: graph_statistics
  kg_stats: stats_info.json
  kg_health_checks: health_checks.json
