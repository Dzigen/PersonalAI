DATASET_NAME: 'diaasqa' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'qwen25_070325_v2prompts' # TO CHANGE
DATASET_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI/data/qa_datasets/diaasqa' # TO CHANGE

KGS_BASE_PATH: '/home/m.menschikov/workspace/personal_ai/Personal-AI/data/knowledge_graphs' # TO CHANGE
BASE_PERSONALAI_DIR: '/home/m.menschikov/workspace/personal_ai/Personal-AI' # TO CHANGE
PERSONALAI_VENV_DIR: '/home/m.menschikov/workspace/personal_ai/.pai_venv' # TO CHANGE
OLLAMA_MODELS_DIR: '/home/m.menschikov/workspace/personal_ai/ollama_volume' # TO CHANGE
INIT_STRUCT: True # !!! PAY ATTENTION !!!

MEM_PIPELINE_CONFIG:
  lang: 'en'
  llm_caching: True # DONT CHANGE
  agent_config:
    vendor: 'ollama' # DONT CHANGE
    gen_strategy:
      num_predict: 2048 # DONT CHANGE
      seed: 42  # DONT CHANGE
      top_k: 1  # DONT CHANGE
      temperature: 0.0  # DONT CHANGE
    credentials:
      host: 'personalai_mmenschikov_ollama_service'
      port: 11434
    ext_params:
      model: 'qwen2.5:7b'
      timeout: 560
      keep_alive: -1
  extractor_stage:
    extract_triplets:
      cache_tname: 'llm_extract_triplets_cache_collection'
      prompts_version: 'v2' # TO CHANGE
      need_to_clear: False # !!! PAY ATTENTION !!!
    extract_thesises:
      cache_tname: 'llm_extract_thesises_cache_collection'
      prompts_version: 'v2' # TO CHANGE
      need_to_clear: False # !!! PAY ATTENTION !!!
  updator_stage:
    delete_obsolete_info: False # DONT CHANGE
    replace_simple_triplets:
      cache_tname: 'llm_replace_simple_triplets_cache_collection'
      prompts_version: 'v1'
      need_to_clear: False # !!! PAY ATTENTION !!!
    replace_thesis_triplets:
      cache_tname: 'llm_replace_thesis_triplets_cache_collection'
      prompts_version: 'v1'
      need_to_clear: False # !!! PAY ATTENTION !!!

  persistent_cache_config:
    vendor: 'mongo' # DONT CHANGE
    host: 'personalai_mmenschikov_mongo_cache'
    port: 27017 # DONT CHANGE
    db_info:
      db: 'memorize_db'
      table: 'mem_llm_cache_collection'
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

  ram_cache_config:
    vendor: 'redis' # DONT CHANGE
    host: 'personalai_mmenschikov_redis_cache'
    port: 6379 # DONT CHANGE
    db_info:
      db: 0
      table: 'mem_llm_cache_collection'
    params:
      ss_name: 'sorted_node_pairs'
      hs_name: 'node_pairs'
      max_storage: 50000000
    db_configuration: '/home/m.menschikov/workspace/personal_ai/Personal-AI/configs/redis' # TO CHANGE

KG_DB_CONFIGS:
  need_to_clear: True # !!! PAY ATTENTION !!!
  graphdb_config:
    vendor: 'neo4j' # DONT CHANGE
    host: 'personalai_mmenschikov_neo4j'
    port: 7687
    params:
      user: 'neo4j'
      pwd: 'password'
    db_info:
      db: 'knowledgegraphdb'
      table: 'knowledgegraphtable'

  nodesdb_config:
    vendor: 'chroma' # DONT CHANGE
    db_info:
      db: 'knowledgegraphdb'
      table: 'vectorized_nodes'

  tripletsdb_config:
      vendor: 'chroma' # DONT CHANGE
      db_info:
        db: 'knowledgegraphdb'
        table: 'vectorized_triplets'

  embedder_config:
    prompts:
      query: "query: "
      passage: "passage: "
    model_name_or_path: '/home/m.menschikov/workspace/personal_ai/Personal-AI/models/intfloat/multilingual-e5-large' # TO CHANGE

KG_DIR_STRUCT:
  embeddings_dir_name: embeddings_part
  graph_dir_name: graph_part
  cache_dir_name:
    base: kv_cache
    persistant: persistent_volume
    ram: ram_volume
  tmp_triplets_dir_name: tmp_extracted_triplets

SAVE_CONFIGS_NAMES:
  graph_config: graph_config
  embeddings_config: embeddings_config
  mem_pipeline_config: mem_pipeline_config

  hyperparameters: hyperparameters.yaml
  extracted_triplets: extracted_triplets

  graph_statistics_dir: graph_statistics
  kg_stats: stats_info.json
  kg_health_checks: health_checks.json

