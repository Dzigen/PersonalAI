GPUS_CONFIG:
    ollama_device_id: '1'
    workspace_device_id: '1'

KG_MODEL_CONNECTORS:

  graph_struc_connection: # neo4j vendor
    host: 'localhost'
    port: 7706 # TO CHANGE
    params:
      user: 'neo4j'
      pwd: 'password'
    db_info:
      db: 'personalaigraphdb'
      table: 'personalaigraphtable'

  embeddings_struc_connection:
    nodesdb_config:
      dense_connector: # milvus vendor
        name: dense_nodes
        conn:
          host: 'localhost'
          port: 19546 # TO CHANGE
          user: 'root'
          pass: 'Milvus'
        db_info:
          db: 'personalaiembeddb'
          table: 'vectorized_nodes'
        params:
          id_length: 32
          vector_dim: 1024
          document_max_length: 51200
          load: True
          flush: True
          create_sleep: 1
          search_metric: 'IP'

      sparse_connector: # elasticsearch vendor
        name: bm25_nodes
        conn:
          host: 'localhost'
          port: 9202 # TO CHANGE
        db_info:
          db: 'personalaiembeddb'
          table: 'bm25_nodes'

    tripletsdb_config:
      dense_connector: # milvus vendor
        name: dense_triplets
        conn:
          host: 'localhost'
          port: 19546 # TO CHANGE
          user: 'root'
          pass: 'Milvus'
        db_info:
          db: 'personalaiembeddb'
          table: 'vectorized_triplets'
        params:
          id_length: 32
          vector_dim: 1024
          document_max_length: 51200
          load: True
          flush: True
          create_sleep: 1
          search_metric: 'IP'

      sparse_connector: # elasticsearch vendor
        name: bm25_triplets
        conn:
          host: 'localhost'
          port: 9202 # TO CHANGE
        db_info:
          db: 'personalaiembeddb'
          table: 'bm25_triplets'

MEM_PIPELINE_CONNECTORS:
  kv_cache_connections:
    persistent_cache_config: # mongo vendor
      host: 'localhost'
      port: 27036 # TO CHANGE
      db_info:
          db: 'personalaikvdb'
          table: 'kvtable'
      params:
        username: 'user'
        password: 'pass'
        max_storage: -1

    ram_cache_config: # redis vendor
      host: 'localhost'
      port: 6398 # TO CHANGE
      db_info:
          db: 'personalaikvdb'
          table: 'kvtable'
      params:
        ss_name: 'sorted_node_pairs'
        hs_name: 'node_pairs'
        max_storage: 50000000
        username: 'my_user'
        password: 'my_user_password'

  inference_stat_connection: # mongo vendor
    host: 'localhost'
    port: 27036 # TO CHANGE
    db_info:
        db: 'personalaiinferencedb'
        table: 'inferencestattable'
    params:
      username: 'user'
      password: 'pass'
      max_storage: -1

