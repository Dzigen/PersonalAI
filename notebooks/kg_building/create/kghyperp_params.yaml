DATASET_NAME: 'hotpotqa_distractor_validation' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'llama318b_021225_v2prompts' # TO CHANGE

KG_CONFIG:
  embedder_configs:
    default:
      prompts:
        query: "query: "
        passage: "passage: "
      model_name_or_path: 'intfloat/multilingual-e5-large'
  embedders_mapping:
    embeddings_model:
      dense_nodes: default
      dense_triplets: default

  agent_configs:
    default: # TO CHANGE
      vendor: ollama
      gen_strategy:
        num_predict: 2048
        seed: 42
        top_k: 1
        temperature: 0.0
      credentials:
        model: 'llama3.1:8b'
        host: 'localhost'
        port: 11437
      ext_params:
        timeout: 560
        keep_alive: -1
        trials: 5

  agents_mapping:
    qa_pipeline: default
    mem_pipeline: default
    kg_nodestree_model: default

MEM_PIPELINE_CONFIG:
  lang: 'en' # TO CHANGE

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2'
    extract_thesises:
      prompts_version: 'v2'
