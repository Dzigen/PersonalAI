DATASET_NAME: 'hotpotqa_distractor_validation' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'deepseek_231025_v2prompts' # TO CHANGE

KG_CONFIG:
  embedder_configs:
    default:
      prompts:
        query: "query: "
        passage: "passage: "
      model_name_or_path: 'intfloat/multilingual-e5-large'
  embedders_mapping:
    embeddings_model:
      dense_nodes: default
      dense_triplets: default

  agent_configs:
    default: # TO CHANGE
      vendor: openai
      credentials:
        token: # !!! SECRET !!!
        model: 'deepseek-chat'
        base_url: 'https://api.deepseek.com'
      gen_strategy:
        seed: 42
        top_p: 0.000000000000001
        temperature: 0.0
        frequency_penalty: 0
        presence_penalty: 0
      ext_params:
        timeout: 560
        max_retries: 5

  agents_mapping:
    qa_pipeline: default
    mem_pipeline: default
    kg_nodestree_model: default

MEM_PIPELINE_CONFIG:
  lang: 'en' # TO CHANGE

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2'
    extract_thesises:
      prompts_version: 'v2'
