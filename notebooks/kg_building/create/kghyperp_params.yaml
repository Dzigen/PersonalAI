DATASET_NAME: 'hotpotqa_distractor_validation' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'gigachatmax_051125_v2prompts' # TO CHANGE

KG_CONFIG:
  embedder_configs:
    default:
      prompts:
        query: "query: "
        passage: "passage: "
      model_name_or_path: 'intfloat/multilingual-e5-large'
  embedders_mapping:
    embeddings_model:
      dense_nodes: default
      dense_triplets: default

  agent_configs:
    default: # TO CHANGE
      vendor: gigachat
      gen_strategy:
        top_k: 1
        top_p: 0
        temperature: 0
      credentials:
        token: secret_key # !!! PAY ATTENTION !!!
        scope: GIGACHAT_API_PERS
        model: GigaChat-Max
      ext_params:
        timeout: 560
        trials: 5
        verify_ssl_certs: False

  agents_mapping:
    qa_pipeline: default
    mem_pipeline: default
    kg_nodestree_model: default

MEM_PIPELINE_CONFIG:
  lang: 'en' # TO CHANGE

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2'
    extract_thesises:
      prompts_version: 'v2'
