DATASET_NAME: 'hotpotqa_distractor_validation' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'qwen38b_261025_v2prompts' # TO CHANGE

KG_CONFIG:
  embedder_configs:
    default:
      prompts:
        query: "query: "
        passage: "passage: "
      model_name_or_path: 'intfloat/multilingual-e5-large'
  embedders_mapping:
    embeddings_model:
      dense_nodes: default
      dense_triplets: default

  agent_configs:
    default: # TO CHANGE
      vendor: ollama
      credentials:
        host: localhost
        model: qwen3:8b
        port: 11437
      ext_params:
        keep_alive: -1
        timeout: 560
      gen_strategy:
        num_predict: 2048
        seed: 42
        temperature: 0.0
        top_k: 1

  agents_mapping:
    qa_pipeline: default
    mem_pipeline: default
    kg_nodestree_model: default

MEM_PIPELINE_CONFIG:
  lang: 'en' # TO CHANGE

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2'
    extract_thesises:
      prompts_version: 'v2'
