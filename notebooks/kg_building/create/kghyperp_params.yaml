DATASET_NAME: 'test_dataset' # TO CHANGE
KNOWLEDGE_GRAPH_NAME: 'deepseek_test_data_v0' # TO CHANGE

KG_CONFIG:
  embedder_configs:
    default:
      prompts:
        query: "query: "
        passage: "passage: "
      model_name_or_path: 'intfloat/multilingual-e5-large'
  embedders_mapping:
    embeddings_model:
      dense_nodes: default
      dense_triplets: default

  agent_configs:
    default: # TO CHANGE
      credentials:
        model: deepseek-chat
        base_url: https://api.deepseek.com
        token:
      ext_params:
        timeout: 560
        trials: 5
        verify_ssl_certs: false
      gen_strategy:
        temperature: 0
        top_p: 10e-16
      vendor: openai

  agents_mapping:
    qa_pipeline: default
    mem_pipeline: default
    kg_nodestree_model: default

MEM_PIPELINE_CONFIG:
  lang: 'ru' # TO CHANGE

  extractor_stage:
    extract_triplets:
      prompts_version: 'v2'
    extract_thesises:
      prompts_version: 'v2'
